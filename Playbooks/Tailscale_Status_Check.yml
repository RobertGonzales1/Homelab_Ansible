---
- name: Tailscale Node Status
  hosts: tailscale
  become: true
  tasks:

    - name: Check if Tailscale is running
      command: tailscale status --json
      register: ts_status
      changed_when: false
      failed_when: false

    - name: Parse Tailscale status
      set_fact:
        ts_data: "{{ ts_status.stdout | from_json }}"
      when: ts_status.rc == 0

    - name: Get connection details
      set_fact:
        ts_self_online: "{{ ts_data.Self.Online | default(false) }}"
        ts_self_name: "{{ ts_data.Self.HostName | default(inventory_hostname) }}"
        ts_self_ip: "{{ ts_data.Self.TailscaleIPs[0] | default('unknown') }}"
        ts_peer_count: "{{ ts_data.Peer | default({}) | length }}"
      when: ts_status.rc == 0

    - name: Display Tailscale status
      debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] -
          {{ 'ONLINE' if (ts_self_online | default(false)) else 'OFFLINE' }} |
          IP: {{ ts_self_ip | default('unknown') }} |
          Peers: {{ ts_peer_count | default(0) }}

    - name: Send Discord alert if Tailscale is down
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🚨 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Tailscale is {{ 'NOT RUNNING' if ts_status.rc != 0 else 'OFFLINE' }}!"
        headers:
          Content-Type: application/json
        status_code: 204
      when:
        - discord_webhook_url is defined
        - ts_status.rc != 0 or not (ts_self_online | default(false))

    - name: Send Discord status report
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🌐 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Tailscale ✅ Online | IP: {{ ts_self_ip }} | {{ ts_peer_count }} peers connected"
        headers:
          Content-Type: application/json
        status_code: 204
      when:
        - discord_webhook_url is defined
        - ts_status.rc == 0
        - ts_self_online | bool
