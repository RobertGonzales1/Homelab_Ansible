---
- name: PBS Backup Verification
  hosts: pbs
  become: true
  vars:
    backup_max_age_hours: 26
  tasks:

    - name: Get backup status from all datastores
      shell: |
        now=$(date +%s)
        threshold=$(( {{ backup_max_age_hours }} * 3600 ))

        for ds in /mnt/datastore/*/; do
          ds_name=$(basename "$ds")

          for type_dir in "$ds"vm/ "$ds"ct/; do
            [ -d "$type_dir" ] || continue
            backup_type=$(basename "$type_dir")

            for id_dir in "$type_dir"*/; do
              [ -d "$id_dir" ] || continue
              backup_id=$(basename "$id_dir")

              latest=$(ls -1d "$id_dir"2* 2>/dev/null | sort | tail -1)
              if [ -n "$latest" ]; then
                snap_name=$(basename "$latest")
                snap_ts=$(date -d "${snap_name}" +%s 2>/dev/null || echo 0)
                if [ "$snap_ts" -gt 0 ]; then
                  age_sec=$(( now - snap_ts ))
                  age_h=$(( age_sec / 3600 ))
                  if [ "$age_sec" -gt "$threshold" ]; then
                    status="STALE"
                  else
                    status="OK"
                  fi
                  echo "${ds_name}|${backup_type}/${backup_id}|${snap_name}|${age_h}h|${status}"
                fi
              fi
            done
          done
        done
      register: backup_report
      changed_when: false

    - name: Build summary
      set_fact:
        stale_backups: "{{ backup_report.stdout_lines | default([]) | select('search', '\\|STALE$') | list }}"
        ok_backups: "{{ backup_report.stdout_lines | default([]) | select('search', '\\|OK$') | list }}"

    - name: Display backup report
      debug:
        msg:
          - "✅ {{ ok_backups | length }} backups OK"
          - "⚠️ {{ stale_backups | length }} stale (>{{ backup_max_age_hours }}h)"
          - "{{ backup_report.stdout }}"

    - name: Build stale backup details
      set_fact:
        stale_details: |
          {% for entry in stale_backups %}
          {% set parts = entry.split('|') %}
          - {{ parts[0] }} / {{ parts[1] }} - last: {{ parts[2] }} ({{ parts[3] }})
          {% endfor %}
      when: stale_backups | length > 0

    - name: Send Discord backup report
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "💾 **PBS Backup Report** ({{ inventory_hostname }} - {{ ansible_host }})\n\n✅ {{ ok_backups | length }} OK | ⚠️ {{ stale_backups | length }} stale (>{{ backup_max_age_hours }}h){{ '\n```\n' + stale_details + '```' if stale_backups | length > 0 else '' }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when: discord_webhook_url is defined

    - name: Get datastore disk usage
      shell: df -h /mnt/datastore/* 2>/dev/null
      register: pbs_storage
      changed_when: false

    - name: Send Discord storage summary
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "📊 PBS Storage ({{ inventory_hostname }}):\n```\n{{ pbs_storage.stdout }}\n```"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when: discord_webhook_url is defined
