---
- name: PBS Backup Verification
  hosts: pbs
  become: true
  vars:
    backup_max_age_hours: 26
  tasks:

    - name: Get backup status from all datastores
      shell: |
        now=$(date +%s)
        threshold=$(( {{ backup_max_age_hours }} * 3600 ))

        for ds in /mnt/datastore/*/; do
          ds_name=$(basename "$ds")
          ok=0
          stale=0
          stale_list=""

          for type_dir in "$ds"vm/ "$ds"ct/; do
            [ -d "$type_dir" ] || continue
            backup_type=$(basename "$type_dir")

            for id_dir in "$type_dir"*/; do
              [ -d "$id_dir" ] || continue
              backup_id=$(basename "$id_dir")

              latest=$(ls -1d "$id_dir"2* 2>/dev/null | sort | tail -1)
              if [ -n "$latest" ]; then
                snap_name=$(basename "$latest")
                snap_ts=$(date -d "${snap_name}" +%s 2>/dev/null || echo 0)
                if [ "$snap_ts" -gt 0 ]; then
                  age_sec=$(( now - snap_ts ))
                  age_h=$(( age_sec / 3600 ))
                  if [ "$age_sec" -gt "$threshold" ]; then
                    stale=$((stale + 1))
                    stale_list="${stale_list}  - ${backup_type}/${backup_id} (${age_h}h ago)\n"
                  else
                    ok=$((ok + 1))
                  fi
                fi
              fi
            done
          done

          echo "DATASTORE:${ds_name}|OK:${ok}|STALE:${stale}"
          if [ -n "$stale_list" ]; then
            printf "${stale_list}" | while read line; do
              echo "DETAIL:${ds_name}|${line}"
            done
          fi
        done
      register: backup_report
      changed_when: false

    - name: Parse datastore summaries
      set_fact:
        datastore_lines: "{{ backup_report.stdout_lines | default([]) | select('match', '^DATASTORE:') | list }}"
        detail_lines: "{{ backup_report.stdout_lines | default([]) | select('match', '^DETAIL:') | list }}"

    - name: Display backup report
      debug:
        msg: "{{ backup_report.stdout_lines }}"

    - name: Send Discord message per datastore
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: >-
            💾 **{{ item.split('|')[0] | replace('DATASTORE:', '') }}**:
            ✅ {{ item.split('|')[1] | replace('OK:', '') }} OK |
            ⚠️ {{ item.split('|')[2] | replace('STALE:', '') }} stale
            (>{{ backup_max_age_hours }}h)
            {% set ds_name = item.split('|')[0] | replace('DATASTORE:', '') %}
            {% set details = detail_lines | select('match', '^DETAIL:' + ds_name + '\\|') | list %}
            {% if details | length > 0 %}

            ```
            {% for d in details %}
            {{ d.split('|', 1)[1] }}
            {% endfor %}
            ```
            {% endif %}
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      loop: "{{ datastore_lines }}"
      when: discord_webhook_url is defined

    - name: Get datastore disk usage
      shell: df -h /mnt/datastore/* 2>/dev/null
      register: pbs_storage
      changed_when: false

    - name: Send Discord storage summary
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "📊 PBS Storage:\n```\n{{ pbs_storage.stdout }}\n```"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when: discord_webhook_url is defined
