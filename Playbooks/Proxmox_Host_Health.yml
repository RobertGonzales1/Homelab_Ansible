# Make sure smartmontools is installed on your PVE hosts (apt install smartmontools) or the SMART checks will return empty.
---
- name: Proxmox Host Health Check
  hosts: proxmox
  become: true
  serial: 5
  vars:
    cpu_temp_warning: 80
    disk_usage_warning: 85
  tasks:

    - name: Get highest CPU temp
      shell: |
        max_temp=0
        if command -v sensors &>/dev/null; then
          max_temp=$(sensors 2>/dev/null | grep -oP '\+\K[0-9.]+(?=°C)' | sort -rn | head -1)
        else
          for zone in /sys/class/thermal/thermal_zone*/temp; do
            temp=$(cat "$zone" 2>/dev/null || echo 0)
            temp_c=$((temp / 1000))
            [ "$temp_c" -gt "$max_temp" ] && max_temp=$temp_c
          done
        fi
        echo "${max_temp:-0}"
      register: max_temp
      changed_when: false

    - name: Get SMART summary
      shell: |
        for disk in $(lsblk -dnpo NAME -e 7,11 2>/dev/null | grep -v "^/dev/zd"); do
          health=$(smartctl -H "$disk" 2>/dev/null | grep -i "overall-health\|SMART Health Status" | sed 's/.*:\s*//')
          reallocated=$(smartctl -A "$disk" 2>/dev/null | grep -i "reallocated_sector\|Reallocated" | awk '{print $NF}')
          failed="no"
          [ -z "$health" ] && continue
          echo "$health" | grep -qi "passed\|ok" || failed="yes"
          [ -n "$reallocated" ] && [ "$reallocated" -gt 0 ] 2>/dev/null && failed="yes"
          if [ "$failed" = "yes" ]; then
            model=$(smartctl -i "$disk" 2>/dev/null | grep "Device Model\|Model Number" | head -1 | sed 's/.*:\s*//')
            echo "$(basename $disk) ${model} - Health:${health} Reallocated:${reallocated:-0}"
          fi
        done
      register: smart_problems
      changed_when: false
      failed_when: false

    - name: Check for ZFS errors
      shell: |
        if command -v zpool >/dev/null 2>&1; then
          degraded=$(zpool status 2>/dev/null | grep "state:" | grep -E "DEGRADED|FAULTED" || true)
          errors=$(zpool status 2>/dev/null | grep "errors:" | grep -v "No known data errors" || true)
          if [ -n "$degraded" ] || [ -n "$errors" ]; then
            zpool status 2>/dev/null | grep -E "pool:|state:|errors:"
          fi
        fi
      args:
        executable: /bin/bash
      register: zfs_problems
      changed_when: false

    - name: Check for high disk usage
      shell: df -h 2>/dev/null | awk 'NR>1 {gsub(/%/,"",$5); if ($5+0 > {{ disk_usage_warning }}) print $6 " at " $5 "%"}'
      register: high_disk
      changed_when: false

    - name: Get system load
      shell: |
        load=$(cat /proc/loadavg | awk '{print $1, $2, $3}')
        cpus=$(nproc)
        echo "Load ${load} (${cpus} CPUs)"
      register: system_load
      changed_when: false

    - name: Get memory usage
      shell: |
        mem_used=$(free -h | awk '/Mem:/ {print $3}')
        mem_total=$(free -h | awk '/Mem:/ {print $2}')
        mem_pct=$(free | awk '/Mem:/ {printf "%.0f", $3/$2*100}')
        echo "RAM ${mem_used} used / ${mem_total} total (${mem_pct}%)"
      register: memory_usage
      changed_when: false

    - name: Build problem flags
      set_fact:
        temp_warning: "{{ max_temp.stdout | float > cpu_temp_warning | float }}"
        smart_warning: "{{ smart_problems.stdout | length > 0 }}"
        zfs_warning: "{{ zfs_problems.stdout | length > 0 }}"
        disk_warning: "{{ high_disk.stdout_lines | default([]) | length > 0 }}"

    - name: Set has_problems
      set_fact:
        has_problems: "{{ (temp_warning | bool) or (smart_warning | bool) or (zfs_warning | bool) or (disk_warning | bool) }}"

    - name: Display health status
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}): {{ system_load.stdout }} | {{ memory_usage.stdout }} | Temp {{ max_temp.stdout }}°C | Problems: {{ has_problems }}"

    - name: Send Discord alert for temperature
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🔥 {{ inventory_hostname }} ({{ ansible_host }}): CPU temp {{ max_temp.stdout }}°C (threshold {{ cpu_temp_warning }}°C)\n{{ system_load.stdout }} | {{ memory_usage.stdout }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - temp_warning | bool

    - name: Send Discord alert for SMART
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "💀 {{ inventory_hostname }} ({{ ansible_host }}): SMART disk issue!\n```\n{{ smart_problems.stdout }}\n```"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - smart_warning | bool

    - name: Send Discord alert for ZFS
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "⚠️ {{ inventory_hostname }} ({{ ansible_host }}): ZFS pool degraded!\n```\n{{ zfs_problems.stdout }}\n```"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - zfs_warning | bool

    - name: Send Discord alert for disk usage
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "📀 {{ inventory_hostname }} ({{ ansible_host }}): High disk usage!\n{{ high_disk.stdout }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - disk_warning | bool
