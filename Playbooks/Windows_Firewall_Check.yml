---
- name: Windows Firewall Status Check
  hosts: all
  gather_facts: false
  serial: 5
  ignore_unreachable: true
  tasks:

    - name: Check host is reachable
      win_ping:
      register: host_check
      failed_when: false

    - name: Get firewall profile status
      win_shell: |
        Get-NetFirewallProfile | ForEach-Object {
          "$($_.Name): Enabled=$($_.Enabled) DefaultInbound=$($_.DefaultInboundAction) DefaultOutbound=$($_.DefaultOutboundAction)"
        }
      register: firewall_profiles
      when: host_check is succeeded

    - name: Check for disabled firewall profiles
      win_shell: |
        $disabled = @()
        Get-NetFirewallProfile | Where-Object { -not $_.Enabled } | ForEach-Object {
          $disabled += $_.Name
        }
        if ($disabled.Count -gt 0) {
          Write-Output "DISABLED: $($disabled -join ', ')"
        } else {
          Write-Output "ALL_ENABLED"
        }
      register: firewall_status
      when: host_check is succeeded

    - name: Display firewall status
      debug:
        msg:
          - "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]"
          - "{{ firewall_profiles.stdout | default('N/A') }}"
          - "Status: {{ firewall_status.stdout | default('N/A') | trim }}"
      when: host_check is succeeded

    - name: Send Discord alert if firewall is disabled
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🚨 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Windows Firewall {{ firewall_status.stdout | trim }}\n```\n{{ firewall_profiles.stdout }}\n```"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      delegate_to: localhost
      when:
        - discord_webhook_url is defined
        - host_check is succeeded
        - firewall_status.stdout is defined
        - "'DISABLED' in firewall_status.stdout"
