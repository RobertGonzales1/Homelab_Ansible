---
- name: Docker Log Rotation
  hosts: docker_vms
  become: true
  serial: 5
  ignore_unreachable: true
  vars:
    max_log_size_mb: 100
  tasks:

    - name: Check host is reachable
      ping:
      register: host_check
      failed_when: false

    - name: Find oversized container logs
      shell: |
        find /var/lib/docker/containers/ -name "*-json.log" -size +{{ max_log_size_mb }}M -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $NF}'
      register: large_logs
      changed_when: false
      when: host_check is succeeded

    - name: Display large logs
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] - {{ large_logs.stdout_lines | length }} logs over {{ max_log_size_mb }}MB"
      when:
        - host_check is succeeded
        - large_logs.stdout is defined

    - name: Truncate oversized container logs
      shell: |
        truncated=0
        for log in $(find /var/lib/docker/containers/ -name "*-json.log" -size +{{ max_log_size_mb }}M 2>/dev/null); do
          truncate -s 0 "$log"
          truncated=$((truncated + 1))
        done
        echo "$truncated"
      register: truncated
      changed_when: truncated.stdout | int > 0
      when: host_check is succeeded

    - name: Configure Docker daemon log rotation
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "50m",
              "max-file": "3"
            }
          }
        owner: root
        group: root
        mode: "0644"
      register: daemon_config
      when: host_check is succeeded

    - name: Restart Docker to apply daemon config
      systemd:
        name: docker
        state: restarted
      when:
        - host_check is succeeded
        - daemon_config.changed is defined
        - daemon_config.changed

    - name: Send Discord notification
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "📜 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Truncated {{ truncated.stdout }} oversized logs.{{ ' Docker daemon log rotation configured (50MB max, 3 files).' if daemon_config.changed else '' }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - host_check is succeeded
        - (truncated.stdout is defined and truncated.stdout | int > 0) or (daemon_config.changed is defined and daemon_config.changed)

    - name: Send Discord alert for unreachable hosts
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🔌 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: VM unreachable"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      delegate_to: localhost
      when:
        - discord_webhook_url is defined
        - host_check is not succeeded
