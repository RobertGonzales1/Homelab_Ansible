---
- name: Enforce Unattended Upgrades
  hosts: docker_vms:linux_vms
  become: true
  serial: 5
  ignore_unreachable: true
  tasks:

    - name: Check host is reachable
      ping:
      register: host_check
      failed_when: false

    - name: Install unattended-upgrades
      apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: true
      when: host_check is succeeded

    - name: Enable unattended-upgrades via dpkg-reconfigure
      debconf:
        name: unattended-upgrades
        question: unattended-upgrades/enable_auto_updates
        value: "true"
        vtype: boolean
      when: host_check is succeeded

    - name: Configure unattended-upgrades
      copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}";
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };

          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";
        owner: root
        group: root
        mode: "0644"
      register: config_changed
      when: host_check is succeeded

    - name: Configure auto-update schedule
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
        owner: root
        group: root
        mode: "0644"
      when: host_check is succeeded

    - name: Verify unattended-upgrades is active
      command: apt-config dump APT::Periodic::Unattended-Upgrade
      register: verify_result
      changed_when: false
      when: host_check is succeeded

    - name: Display verification
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] - Unattended upgrades: {{ 'ENABLED' if '1' in verify_result.stdout else 'DISABLED' }}"
      when:
        - host_check is succeeded
        - verify_result.stdout is defined

    - name: Send Discord notification
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🔧 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Unattended-upgrades {{ 'configured successfully' if config_changed.changed else 'already configured' }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - host_check is succeeded
        - config_changed.changed is defined
        - config_changed.changed

    - name: Send Discord alert for unreachable hosts
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🔌 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: VM unreachable"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      delegate_to: localhost
      when:
        - discord_webhook_url is defined
        - host_check is not succeeded
