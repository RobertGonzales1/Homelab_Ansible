---
- name: Windows Update
  hosts: all
  gather_facts: false
  serial: 5
  ignore_unreachable: true
  tasks:

    - name: Check host is reachable
      win_ping:
      register: host_check
      failed_when: false

    - name: Check for available updates
      win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
          - UpdateRollups
          - Updates
        state: searched
      register: available_updates
      when: host_check is succeeded

    - name: Display available updates
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] - {{ available_updates.found_update_count }} updates available"
      when:
        - host_check is succeeded
        - available_updates.found_update_count is defined

    - name: Install updates and reboot if needed
      win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
          - UpdateRollups
          - Updates
        reboot: true
        reboot_timeout: 600
      register: update_result
      when:
        - host_check is succeeded
        - available_updates.found_update_count is defined
        - available_updates.found_update_count > 0

    - name: Send Discord notification
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "📦 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: {{ update_result.installed_update_count | default(0) }} updates installed.{{ ' 🔄 Rebooted.' if update_result.reboot_required | default(false) else '' }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      delegate_to: localhost
      when:
        - discord_webhook_url is defined
        - host_check is succeeded
        - update_result.installed_update_count is defined
        - update_result.installed_update_count > 0
