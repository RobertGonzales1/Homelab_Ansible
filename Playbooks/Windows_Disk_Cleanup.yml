---
- name: Windows Disk Cleanup
  hosts: all
  gather_facts: false
  serial: 5
  ignore_unreachable: true
  tasks:

    - name: Check host is reachable
      win_ping:
      register: host_check
      failed_when: false

    - name: Get disk space before cleanup
      win_shell: |
        $disk = Get-WmiObject Win32_LogicalDisk -Filter "DeviceID='C:'"
        [math]::Round($disk.FreeSpace / 1GB, 2)
      register: space_before
      when: host_check is succeeded

    - name: Clear Windows temp files
      win_shell: |
        $cleared = 0
        $paths = @(
          "$env:TEMP",
          "C:\Windows\Temp",
          "C:\Windows\SoftwareDistribution\Download"
        )
        foreach ($path in $paths) {
          if (Test-Path $path) {
            $size = (Get-ChildItem $path -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            $cleared += $size
            Remove-Item "$path\*" -Recurse -Force -ErrorAction SilentlyContinue
          }
        }
        Write-Output "$([math]::Round($cleared / 1MB, 0))MB"
      register: temp_cleared
      when: host_check is succeeded

    - name: Clear recycle bin
      win_shell: Clear-RecycleBin -Force -ErrorAction SilentlyContinue; Write-Output "Done"
      register: recycle_cleared
      failed_when: false
      when: host_check is succeeded

    - name: Clear Windows Update cache
      win_shell: |
        Stop-Service wuauserv -Force -ErrorAction SilentlyContinue
        if (Test-Path "C:\Windows\SoftwareDistribution") {
          $size = (Get-ChildItem "C:\Windows\SoftwareDistribution" -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
          Remove-Item "C:\Windows\SoftwareDistribution\*" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output "$([math]::Round($size / 1MB, 0))MB"
        } else {
          Write-Output "0MB"
        }
        Start-Service wuauserv -ErrorAction SilentlyContinue
      register: wu_cleared
      when: host_check is succeeded

    - name: Clear event logs
      win_shell: |
        Get-WinEvent -ListLog * -ErrorAction SilentlyContinue | ForEach-Object {
          [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog($_.LogName)
        } 2>$null
        Write-Output "Done"
      register: logs_cleared
      failed_when: false
      when: host_check is succeeded

    - name: Get disk space after cleanup
      win_shell: |
        $disk = Get-WmiObject Win32_LogicalDisk -Filter "DeviceID='C:'"
        [math]::Round($disk.FreeSpace / 1GB, 2)
      register: space_after
      when: host_check is succeeded

    - name: Calculate space reclaimed
      set_fact:
        reclaimed: "{{ (space_after.stdout | trim | float - space_before.stdout | trim | float) | round(2) }}"
      when:
        - host_check is succeeded
        - space_before.stdout is defined
        - space_after.stdout is defined

    - name: Display cleanup results
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] - Reclaimed {{ reclaimed }}GB (Temp: {{ temp_cleared.stdout | trim }}, WU Cache: {{ wu_cleared.stdout | trim }})"
      when:
        - host_check is succeeded
        - reclaimed is defined

    - name: Send Discord notification
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🧹 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Disk cleanup reclaimed {{ reclaimed }}GB\nTemp files: {{ temp_cleared.stdout | trim }} | WU cache: {{ wu_cleared.stdout | trim }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      delegate_to: localhost
      when:
        - discord_webhook_url is defined
        - host_check is succeeded
        - reclaimed is defined
        - reclaimed | float > 0.1
