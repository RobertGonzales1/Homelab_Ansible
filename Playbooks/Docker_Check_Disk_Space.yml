---
- name: Check Disk Space and Alert via Discord
  hosts: linux_vms
  become: true
  tasks:

    - name: Get full disk usage report
      command: df -h
      register: disk_usage_full
      changed_when: false

    - name: Get root partition usage percentage
      shell: df -h / | awk 'NR==2 {print $5}'
      register: disk_usage
      changed_when: false

    - name: Display disk usage
      debug:
        msg: "{{ inventory_hostname }} root partition is {{ disk_usage.stdout }} used"

    - name: Send Discord alert when disk space is over 80%
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "⚠️ Disk space on {{ inventory_hostname }} is at {{ disk_usage.stdout }}!\n```\n{{ disk_usage_full.stdout }}\n```"
        headers:
          Content-Type: application/json
        status_code: 204
      when: disk_usage.stdout | replace('%', '') | int > 80
