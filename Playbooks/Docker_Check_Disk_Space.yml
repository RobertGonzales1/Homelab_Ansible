---
- name: Check Disk Space and Alert via Discord
  hosts: docker_vms:linux_vms
  become: true
  serial: 5
  ignore_unreachable: true
  tasks:

    - name: Check host is reachable
      ping:
      register: host_check
      failed_when: false

    - name: Get full disk usage report
      command: df -h
      register: disk_usage_full
      changed_when: false
      when: host_check is succeeded

    - name: Get root partition usage percentage
      shell: df -h / | awk 'NR==2 {print $5}'
      register: disk_usage
      changed_when: false
      when: host_check is succeeded

    - name: Display disk usage
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] root partition is {{ disk_usage.stdout }} used"
      when:
        - host_check is succeeded
        - disk_usage.stdout is defined

    - name: Send Discord alert when disk space is over 80%
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "⚠️ {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] is at {{ disk_usage.stdout }} disk usage!\n```\n{{ disk_usage_full.stdout }}\n```"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - host_check is succeeded
        - disk_usage.stdout is defined
        - disk_usage.stdout | replace('%', '') | int > 80

    - name: Send Discord alert for unreachable hosts
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🔌 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: VM unreachable"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      delegate_to: localhost
      when:
        - discord_webhook_url is defined
        - host_check is not succeeded
