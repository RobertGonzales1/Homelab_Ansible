---
- name: SSH Key Audit
  hosts: docker_vms:linux_vms
  become: true
  serial: 5
  tasks:

    - name: Check if password authentication is enabled
      shell: sshd -T 2>/dev/null | grep -i "passwordauthentication" | awk '{print $2}'
      register: password_auth
      changed_when: false

    - name: Check for root login enabled
      shell: sshd -T 2>/dev/null | grep -i "permitrootlogin" | awk '{print $2}'
      register: root_login
      changed_when: false

    - name: Check SSH port
      shell: sshd -T 2>/dev/null | grep -i "^port " | awk '{print $2}'
      register: ssh_port
      changed_when: false

    - name: Get authorized keys summary
      shell: |
        for user_home in /root /home/*; do
          keyfile="${user_home}/.ssh/authorized_keys"
          if [ -f "$keyfile" ]; then
            user=$(basename "$user_home")
            [ "$user_home" = "/root" ] && user="root"
            count=$(grep -c "^ssh-" "$keyfile" 2>/dev/null || echo 0)
            keys=$(grep "^ssh-" "$keyfile" 2>/dev/null | awk '{print $NF}' | tr '\n' ', ' | sed 's/,$//')
            if [ "$count" -gt 0 ]; then
              echo "  🔑 ${user}: ${count} key(s) [${keys}]"
            else
              echo "  🔑 ${user}: no keys"
            fi
          fi
        done
      register: ssh_keys_summary
      changed_when: false

    - name: Display audit results
      debug:
        msg:
          - "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]"
          - "Password auth: {{ password_auth.stdout | default('unknown') }}"
          - "Root login: {{ root_login.stdout | default('unknown') }}"
          - "SSH port: {{ ssh_port.stdout | default('unknown') }}"
          - "{{ ssh_keys_summary.stdout | default('No keys found') }}"

    - name: Check for security issues
      set_fact:
        has_issues: "{{ (password_auth.stdout | default('no')) == 'yes' or (root_login.stdout | default('no')) == 'yes' }}"

    - name: Send Discord alert for security issues
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🔐 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]:{{ ' ⚠️ Password auth ENABLED!' if password_auth.stdout == 'yes' else '' }}{{ ' ⚠️ Root login ENABLED!' if root_login.stdout == 'yes' else '' }}\nPort: {{ ssh_port.stdout }}\n```\n{{ ssh_keys_summary.stdout }}\n```"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - has_issues | bool
