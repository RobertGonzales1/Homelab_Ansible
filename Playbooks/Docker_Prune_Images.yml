---
- name: Remove Unused Docker Images
  hosts: docker_vms
  become: true
  serial: 5
  gather_facts: false
  tasks:

    - name: Check host is reachable
      wait_for_connection:
        timeout: 10
      register: host_check
      ignore_errors: true

    - name: Send Discord alert for unreachable hosts
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🔌 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: VM unreachable"
        headers:
          Content-Type: application/json
        status_code: 204
      delegate_to: localhost
      when:
        - discord_webhook_url is defined
        - host_check is failed

    - name: Skip unreachable hosts
      meta: end_host
      when: host_check is failed

    - name: Gather facts
      setup:

    - name: Get list of dangling images before cleanup
      command: docker images -f dangling=true -q
      register: dangling_before
      changed_when: false

    - name: Display current images
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] has {{ dangling_before.stdout_lines | length }} dangling images"

    - name: Remove all unused Docker images
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: false
      register: prune_result

    - name: Send Discord notification
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🧹 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Removed {{ prune_result.images | default([]) | length }} images, reclaimed {{ prune_result.images_space_reclaimed | default(0) | human_readable }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - prune_result.images | default([]) | length > 0
