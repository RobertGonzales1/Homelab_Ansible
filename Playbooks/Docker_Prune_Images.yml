---
- name: Remove Unused Docker Images
  hosts: docker_vms
  become: true
  tasks:

    - name: Get list of dangling images before cleanup
      command: docker images -f dangling=true -q
      register: dangling_before
      changed_when: false

    - name: Get list of unused images before cleanup
      shell: "docker images --format '{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }} {{ '{{' }}.Size{{ '}}' }}' | head -20"
      register: images_before
      changed_when: false

    - name: Display current images
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] has {{ dangling_before.stdout_lines | length }} dangling images"

    - name: Remove all unused Docker images
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: false
      register: prune_result

    - name: Display cleanup results
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] - Reclaimed {{ prune_result.images_space_reclaimed | default(0) | human_readable }}"
      when: prune_result is defined

    - name: Send Discord notification
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🧹 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Removed {{ prune_result.images | default([]) | length }} images, reclaimed {{ prune_result.images_space_reclaimed | default(0) | human_readable }}"
        headers:
          Content-Type: application/json
        status_code: 204
      when:
        - discord_webhook_url is defined
        - prune_result.images | default([]) | length > 0
