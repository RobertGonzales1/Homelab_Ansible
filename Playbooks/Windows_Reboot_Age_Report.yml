---
- name: Windows Reboot Age Report
  hosts: all
  gather_facts: false
  serial: 5
  ignore_unreachable: true
  vars:
    max_uptime_days: 90
  tasks:

    - name: Check host is reachable
      win_ping:
      register: host_check
      failed_when: false

    - name: Get uptime
      win_shell: |
        $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
        $uptime = (Get-Date) - $boot
        $days = [math]::Round($uptime.TotalDays, 1)
        Write-Output "DAYS:$days"
        Write-Output "Last reboot: $($boot.ToString('yyyy-MM-dd HH:mm:ss')) ($days days ago)"
      register: uptime_info
      when: host_check is succeeded

    - name: Extract days
      set_fact:
        uptime_days: "{{ uptime_info.stdout_lines | select('match', '^DAYS:') | first | replace('DAYS:', '') }}"
      when:
        - host_check is succeeded
        - uptime_info.stdout is defined

    - name: Get pending reboot status
      win_shell: |
        $pending = $false
        if (Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired") { $pending = $true }
        if (Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending") { $pending = $true }
        if ($pending) { Write-Output "REBOOT PENDING" } else { Write-Output "No reboot pending" }
      register: reboot_pending
      when: host_check is succeeded

    - name: Display uptime
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] - {{ uptime_info.stdout_lines | reject('match', '^DAYS:') | join('') }} | {{ reboot_pending.stdout | trim }}"
      when:
        - host_check is succeeded
        - uptime_info.stdout is defined

    - name: Send Discord alert for stale VMs
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🔄 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: {{ uptime_info.stdout_lines | reject('match', '^DAYS:') | join('') }}{{ ' ⚠️ REBOOT PENDING' if 'REBOOT PENDING' in reboot_pending.stdout else '' }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      delegate_to: localhost
      when:
        - discord_webhook_url is defined
        - host_check is succeeded
        - uptime_days is defined
        - (uptime_days | float > max_uptime_days | float) or ('REBOOT PENDING' in reboot_pending.stdout)
