---
- name: Update Linux Packages
  hosts: docker_vms:linux_vms
  become: true
  serial: 5
  tasks:

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false

    - name: Get list of upgradable packages
      command: apt list --upgradable
      register: upgradable
      changed_when: false

    - name: Display upgradable packages
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] - {{ upgradable.stdout_lines | length - 1 }} packages to upgrade"

    - name: Upgrade all packages
      apt:
        upgrade: safe
        autoremove: true
        autoclean: true
      register: upgrade_result

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Send Discord notification before reboot
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "📦 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: {{ upgradable.stdout_lines | length - 1 }} packages upgraded. {{ '🔄 Rebooting now...' if reboot_required.stat.exists else '✅ No reboot needed.' }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - upgradable.stdout_lines | length > 1

    - name: Reboot if required
      reboot:
        reboot_timeout: 300
        msg: "Rebooting after package updates"
      when: reboot_required.stat.exists

    - name: Wait for host to come back
      wait_for_connection:
        delay: 10
        timeout: 300
      when: reboot_required.stat.exists

    - name: Verify host is up after reboot
      ping:
      when: reboot_required.stat.exists

    - name: Send Discord notification after reboot
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "✅ {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Back online after reboot."
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - reboot_required.stat.exists
