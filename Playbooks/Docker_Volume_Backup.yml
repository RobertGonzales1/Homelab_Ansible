---
- name: Docker Volume Backup
  hosts: docker_vms
  become: true
  vars:
    backup_dest: /mnt/backup/docker-volumes
    retention_days: 7
  tasks:

    - name: Create backup directory
      file:
        path: "{{ backup_dest }}/{{ inventory_hostname }}"
        state: directory
        mode: "0750"

    - name: Get list of docker volumes
      command: docker volume ls --format '{{ '{{' }}.Name{{ '}}' }}'
      register: docker_volumes
      changed_when: false

    - name: Display volumes to back up
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}] - {{ docker_volumes.stdout_lines | length }} volumes to back up"

    - name: Get compose project directories
      shell: |
        for dir in /opt/docker /home/*/docker; do
          if [ -d "$dir" ]; then
            find "$dir" -maxdepth 2 -name "docker-compose.yml" -o -name "docker-compose.yaml" -o -name "compose.yml" -o -name "compose.yaml" 2>/dev/null
          fi
        done
      register: compose_files
      changed_when: false

    - name: Backup compose files
      shell: |
        mkdir -p {{ backup_dest }}/{{ inventory_hostname }}/compose
        for file in {{ compose_files.stdout_lines | join(' ') }}; do
          dir=$(dirname "$file")
          project=$(basename "$dir")
          cp "$file" "{{ backup_dest }}/{{ inventory_hostname }}/compose/${project}_$(basename $file)"
        done
      when: compose_files.stdout_lines | length > 0
      register: compose_backup

    - name: Backup each docker volume
      shell: |
        timestamp=$(date +%Y%m%d_%H%M%S)
        docker run --rm \
          -v {{ item }}:/source:ro \
          -v {{ backup_dest }}/{{ inventory_hostname }}:/backup \
          alpine tar czf /backup/{{ item }}_${timestamp}.tar.gz -C /source .
      loop: "{{ docker_volumes.stdout_lines }}"
      register: volume_backup
      failed_when: false

    - name: Count successful backups
      set_fact:
        successful_backups: "{{ volume_backup.results | selectattr('rc', 'equalto', 0) | list | length }}"
        failed_backups: "{{ volume_backup.results | selectattr('rc', 'ne', 0) | list | length }}"

    - name: Remove backups older than retention period
      find:
        paths: "{{ backup_dest }}/{{ inventory_hostname }}"
        patterns: "*.tar.gz"
        age: "{{ retention_days }}d"
      register: old_backups

    - name: Delete old backups
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"
      when: old_backups.files | length > 0

    - name: Get total backup size
      shell: du -sh {{ backup_dest }}/{{ inventory_hostname }} | awk '{print $1}'
      register: backup_size
      changed_when: false

    - name: Send Discord notification
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "💾 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]: Volume backup complete - {{ successful_backups }}/{{ docker_volumes.stdout_lines | length }} succeeded{{ ', ' + failed_backups + ' failed' if failed_backups | int > 0 else '' }}. Total size: {{ backup_size.stdout }}. Cleaned {{ old_backups.files | length }} old backups."
        headers:
          Content-Type: application/json
        status_code: 204
      when: discord_webhook_url is defined
