---
- name: VM Snapshot Cleanup
  hosts: proxmox
  become: true
  serial: 5
  vars:
    snapshot_max_age_days: 7
  tasks:

    - name: Get all VMs on this node
      shell: qm list | awk 'NR>1 {print $1}'
      register: vm_list
      changed_when: false

    - name: Get snapshots for each VM
      shell: |
        for vmid in {{ vm_list.stdout_lines | join(' ') }}; do
          snapshots=$(qm listsnapshot $vmid 2>/dev/null | grep -v "current" | grep -v "^$" | awk '{print $2}')
          if [ -n "$snapshots" ]; then
            for snap in $snapshots; do
              snap_config=$(qm config $vmid --snapshot "$snap" 2>/dev/null)
              snap_date=$(echo "$snap_config" | grep "snaptime" | awk '{print $2}')
              if [ -n "$snap_date" ]; then
                age_days=$(( ($(date +%s) - snap_date) / 86400 ))
                vm_name=$(qm config $vmid | grep "^name:" | awk '{print $2}')
                echo "$vmid|$vm_name|$snap|$age_days"
              fi
            done
          fi
        done
      register: all_snapshots
      changed_when: false

    - name: Identify old snapshots
      set_fact:
        old_snapshots: "{{ all_snapshots.stdout_lines | default([]) | select('search', '\\|[0-9]+$') | list }}"

    - name: Display snapshot report
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) - Found {{ all_snapshots.stdout_lines | default([]) | length }} total snapshots"

    - name: Remove snapshots older than threshold
      shell: |
        removed=0
        for entry in {{ all_snapshots.stdout_lines | default([]) | join(' ') }}; do
          vmid=$(echo "$entry" | cut -d'|' -f1)
          snap=$(echo "$entry" | cut -d'|' -f3)
          age=$(echo "$entry" | cut -d'|' -f4)
          if [ "$age" -gt "{{ snapshot_max_age_days }}" ] && [ "$snap" != "current" ]; then
            qm delsnapshot $vmid "$snap" 2>/dev/null && removed=$((removed + 1))
          fi
        done
        echo "$removed"
      register: removed_snapshots
      changed_when: removed_snapshots.stdout | int > 0
      when: all_snapshots.stdout_lines | default([]) | length > 0

    - name: Also check LXC containers for snapshots
      shell: |
        for ctid in $(pct list | awk 'NR>1 {print $1}'); do
          snapshots=$(pct listsnapshot $ctid 2>/dev/null | grep -v "current" | grep -v "^$" | awk '{print $2}')
          if [ -n "$snapshots" ]; then
            for snap in $snapshots; do
              ct_name=$(pct config $ctid | grep "^hostname:" | awk '{print $2}')
              echo "$ctid|$ct_name|$snap"
            done
          fi
        done
      register: ct_snapshots
      changed_when: false

    - name: Send Discord report
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🧹 {{ inventory_hostname }} ({{ ansible_host }}): Snapshot cleanup - Removed {{ removed_snapshots.stdout | default('0') }} VM snapshots older than {{ snapshot_max_age_days }} days. {{ ct_snapshots.stdout_lines | default([]) | length }} LXC snapshots found."
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - (removed_snapshots.stdout | default('0') | int > 0) or (ct_snapshots.stdout_lines | default([]) | length > 0)
