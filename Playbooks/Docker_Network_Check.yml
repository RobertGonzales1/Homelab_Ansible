---
- name: Docker Network Check
  hosts: docker_vms
  become: true
  serial: 5
  tasks:

    - name: Check external DNS resolution
      shell: docker run --rm alpine nslookup google.com 2>&1 | tail -3
      register: dns_check
      changed_when: false
      failed_when: false

    - name: Check external connectivity
      shell: docker run --rm alpine wget -q -O /dev/null --timeout=5 http://google.com 2>&1; echo "exit:$?"
      register: internet_check
      changed_when: false
      failed_when: false

    - name: Get docker networks
      command: docker network ls --format '{{ '{{' }}.Name{{ '}}' }}'
      register: networks
      changed_when: false

    - name: Check for containers with no network
      shell: |
        for container in $(docker ps --format '{{ '{{' }}.Names{{ '}}' }}'); do
          nets=$(docker inspect --format '{{ '{{' }}range $key, $val := .NetworkSettings.Networks{{ '}}' }}{{ '{{' }}$key{{ '}}' }} {{ '{{' }}end{{ '}}' }}' "$container" 2>/dev/null)
          if [ -z "$nets" ]; then
            echo "$container (no network)"
          fi
        done
      register: no_network
      changed_when: false

    - name: Check inter-container connectivity on each network
      shell: |
        failed=""
        for net in $(docker network ls --format '{{ '{{' }}.Name{{ '}}' }}' | grep -v "^host$" | grep -v "^none$"); do
          containers=$(docker network inspect "$net" --format '{{ '{{' }}range .Containers{{ '}}' }}{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}end{{ '}}' }}' 2>/dev/null)
          count=$(echo "$containers" | wc -w)
          if [ "$count" -gt 1 ]; then
            first=$(echo "$containers" | awk '{print $1}')
            second=$(echo "$containers" | awk '{print $2}')
            result=$(docker exec "$first" ping -c 1 -W 2 "$second" 2>&1 && echo "PASS" || echo "FAIL")
            if echo "$result" | grep -q "FAIL"; then
              failed="${failed}${net}: ${first} -> ${second} FAIL\n"
            fi
          fi
        done
        if [ -z "$failed" ]; then
          echo "ALL_OK"
        else
          printf "$failed"
        fi
      register: connectivity
      changed_when: false
      failed_when: false

    - name: Build problem report
      set_fact:
        dns_ok: "{{ dns_check.rc == 0 and 'NXDOMAIN' not in dns_check.stdout }}"
        internet_ok: "{{ 'exit:0' in internet_check.stdout }}"
        network_ok: "{{ 'ALL_OK' in connectivity.stdout }}"
        has_orphans: "{{ no_network.stdout_lines | default([]) | length > 0 }}"

    - name: Display network status
      debug:
        msg:
          - "{{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]"
          - "DNS: {{ '✅' if dns_ok else '❌' }} | Internet: {{ '✅' if internet_ok else '❌' }} | Inter-container: {{ '✅' if network_ok else '❌' }}"
          - "Orphaned containers: {{ no_network.stdout_lines | default([]) | length }}"

    - name: Set has_problems flag
      set_fact:
        has_problems: "{{ not (dns_ok | bool) or not (internet_ok | bool) or not (network_ok | bool) or (has_orphans | bool) }}"

    - name: Send Discord alert for network problems
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "🌐 {{ inventory_hostname }} ({{ ansible_host }}) [{{ proxmox_node }}]:\nDNS: {{ '✅' if dns_ok else '❌ FAILED' }} | Internet: {{ '✅' if internet_ok else '❌ FAILED' }} | Inter-container: {{ '✅' if network_ok else '❌ FAILED' }}{{ '\nOrphaned: ' + (no_network.stdout_lines | join(', ')) if has_orphans else '' }}{{ '\n```\n' + connectivity.stdout + '\n```' if not network_ok else '' }}"
        headers:
          Content-Type: application/json
        status_code: 204
      register: discord_result
      until: discord_result.status == 204
      retries: 3
      delay: 3
      when:
        - discord_webhook_url is defined
        - has_problems | bool
